version: '3.8'

services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: webpoint-lms-app
        restart: always
        ports:
            - '3001:3001'
        environment:
            DATABASE_URL: postgresql://${DB_USERNAME:-postgres}:${DB_PASSWORD:-root}@global-postgres-db:5432/${DB_DATABASE:-webpoint_lms}?schema=public
            NODE_ENV: production
            PORT: 3001
            JWT_SECRET: ${JWT_SECRET:-0T{yCX3t~w1}}
        networks:
            - global-vps-network
        depends_on:
            - global-postgres-db

    global-postgres-db:
        image: postgres:15-alpine
        container_name: webpoint-lms-db
        restart: always
        environment:
            POSTGRES_USER: ${DB_USERNAME:-postgres}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-root}
            POSTGRES_DB: ${DB_DATABASE:-webpoint_lms}
        volumes:
            - postgres_data_prod:/var/lib/postgresql/data
        networks:
            - global-vps-network

volumes:
    postgres_data_prod:

networks:
    global-vps-network:
        external: true
