version: '3.8'

services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: webpoint-lms-app
        restart: always
        environment:
            DATABASE_URL: postgresql://${DB_USERNAME:-postgres}:${DB_PASSWORD:-root}@global-postgres-db:5432/${DB_DATABASE:-webpoint_lms}?schema=public
            NODE_ENV: production
            PORT: 3000
            JWT_SECRET: ${JWT_SECRET:-0T{yCX3t~w1}}
        networks:
            - global-vps-network
        depends_on:
            - global-postgres-db

    global-postgres-db:
        image: postgres:15-alpine
        container_name: webpoint-lms-db
        restart: always
        environment:
            POSTGRES_USER: ${DB_USERNAME:-postgres}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-root}
            POSTGRES_DB: ${DB_DATABASE:-webpoint_lms}
        ports:
            - '5432:5432'
        volumes:
            - postgres_data_prod:/var/lib/postgresql/data
        networks:
            - global-vps-network

    webserver:
        image: nginx:alpine
        container_name: webpoint-lms-nginx
        restart: always
        ports:
            - '8080:80'
        volumes:
            # Mount file konfigurasi Nginx untuk meneruskan trafik (reverse proxy) ke service app
            - ./docker-config/app.conf:/etc/nginx/conf.d/default.conf
        networks:
            - global-vps-network
        depends_on:
            - app

volumes:
    postgres_data_prod:

networks:
    global-vps-network:
        external: true
